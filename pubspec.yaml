name: simple_calculator
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter

  record: ^7.1.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  # Yeh 2 lines add karein:
  sqflite: ^2.3.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# Launcher icons ki settings
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false # <--- Humne isay false kar diya hai taake iOS error na aaye
  image_path: "assets/app_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/app_logo.png