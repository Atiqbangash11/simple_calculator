workflows:
  ios-unsigned-compile-check:
    name: iOS unsigned compile check
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: 3.44.6
      xcode: 16.3
      cocoapods: default
    scripts:
      - flutter pub get
      - cd ios && pod install --repo-update
      - flutter analyze
      - flutter build ios --debug --no-codesign
    artifacts:
      - build/ios/iphonesimulator/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  ios-release:
    name: iOS release (App Store Connect signing)
    instance_type: mac_mini_m2
    max_build_duration: 90
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    environment:
      flutter: 3.44.6
      xcode: 16.3
      cocoapods: default
      groups:
        - app_store_connect
    scripts:
      - flutter pub get
      - cd ios && pod install --repo-update
      - flutter build ios --release
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
